<script>
(function(){
  "use strict";

  /* ---------- 素材表：真图到位后，把 null 换成 './assets/B4.webp' 即可 ---------- */
  var ASSETS = {
    B1:"./assets/B1.webp", B2:"./assets/B2.webp", B3:"./assets/B3.webp", B4:"./assets/B4.webp", B5:"./assets/B5.webp", B6:"./assets/B6.webp", B7:"./assets/B7.webp", B8:"./assets/B8.webp",
    L1:"./assets/L1.png", L2:"./assets/L2.png", L3:null, L4:null, L5:"./assets/L5.png", L6:"./assets/L6.png"
  };
  /* ============ 音乐：Web Audio 实时合成，不依赖任何音频文件 ============
     一拍一个音的程序化配乐：钟片 + 和声垫 + 鲸歌低频。
     场景切换时换调式与密度，不是切歌，是同一片海换个天气。 */
  var AUDIO = (function(){
    var ctx = null, master = null, rev = null, dry = null;
    var whale = null, whaleGain = null, pads = [];
    var timer = null, next = 0, step = 0, ready = false, hushing = false;
    var muted = (function(){ try { return localStorage.getItem("jingluo_mute") === "1"; } catch (e) { return false; } })();
    var want = "title", cur = "title";

    var SC = { min:[0,3,5,7,10], maj:[0,2,4,7,9], sus:[0,2,5,7,10] };
    /* pad 用半音绝对偏移，踩在根音上 */
    var M = {
      title :{root:220.00, sc:"min", bpm:50, vel:.085, pad:[0,3,7],      whale:0,
              pat:[0,null,4,null,2,null,null,null,3,null,1,null,null,4,null,null]},
      room  :{root:246.94, sc:"min", bpm:56, vel:.075, pad:[0,3,7,10],   whale:0,
              pat:[0,null,2,4,null,3,null,1,null,null,4,2,null,null,3,null]},
      shore :{root:196.00, sc:"min", bpm:48, vel:.078, pad:[0,7,10],     whale:1,
              pat:[0,null,null,4,null,2,null,null,null,3,null,null,1,null,null,null]},
      tide  :{root:174.61, sc:"sus", bpm:42, vel:.085, pad:[0,5,7],      whale:1,
              pat:[0,null,null,null,3,null,null,null,4,null,null,null,2,null,null,null]},
      deep  :{root:130.81, sc:"sus", bpm:40, vel:.050, pad:[0,7,12],     whale:1,
              pat:[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null]},
      ending:{root:261.63, sc:"maj", bpm:54, vel:.080, pad:[0,4,7,9],    whale:0,
              pat:[0,null,2,null,4,null,null,2,null,3,null,null,1,4,null,null]},
      empty :{root:130.81, sc:"min", bpm:40, vel:.050, pad:[0,7],        whale:1,
              pat:[null,null,null,null,null,null,null,null,0,null,null,null,null,null,null,null]},
      /* 鲸歌：只留一条会滑音的领唱线，钟片全停 */
      song  :{root:196.00, sc:"min", bpm:44, vel:.000, pad:[0,7,12],     whale:0, call:1, fade:1.6,
              pat:[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null]},
      /* 她停下来那一刻：世界先静一秒，再慢慢回来 */
      hush  :{root:196.00, sc:"min", bpm:40, vel:.000, pad:[0,7],        whale:0, fade:0.35,
              pat:[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null]}
    };

    function ir(sec, decay){
      var len = Math.floor(ctx.sampleRate * sec);
      var buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (var c = 0; c < 2; c++) {
        var d = buf.getChannelData(c);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      return buf;
    }

    function init(){
      if (ready) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ctx = new AC(); } catch (e) { return; }
      master = ctx.createGain(); master.gain.value = muted ? 0 : 0.38;
      master.connect(ctx.destination);
      rev = ctx.createConvolver(); rev.buffer = ir(2.8, 3.4);
      var wet = ctx.createGain(); wet.gain.value = 0.55; rev.connect(wet); wet.connect(master);
      dry = ctx.createGain(); dry.gain.value = 0.80; dry.connect(master);

      whale = ctx.createOscillator(); whale.type = "sine"; whale.frequency.value = 62;
      whaleGain = ctx.createGain(); whaleGain.gain.value = 0;
      var lfo = ctx.createOscillator(), lfoG = ctx.createGain();
      lfo.frequency.value = 0.07; lfoG.gain.value = 3.4;
      lfo.connect(lfoG); lfoG.connect(whale.frequency); lfo.start();
      whale.connect(whaleGain); whaleGain.connect(rev); whaleGain.connect(dry);
      whale.start();

      ready = true; next = ctx.currentTime + 0.12; step = 0;
      buildPad(M[want]);
      whaleGain.gain.setTargetAtTime(M[want].whale ? 0.055 : 0, ctx.currentTime, 1.2);
      timer = setInterval(tick, 180);
      updateBtn();
    }

    function buildPad(m){
      var now = ctx.currentTime;
      m.pad.forEach(function(semi, i){
        var o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
        o.type = (i % 2) ? "triangle" : "sine";
        o.frequency.value = (m.root / 2) * Math.pow(2, semi / 12);
        lp.type = "lowpass"; lp.frequency.value = 760; lp.Q.value = 0.5;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.032, now + 4.5);
        o.connect(lp); lp.connect(g); g.connect(dry); g.connect(rev);
        o.start(now);
        pads.push({ o: o, g: g });
      });
    }

    function bell(deg, t, m){
      var semi = SC[m.sc][deg % 5] + 12 * Math.floor(deg / 5);
      var f = m.root * Math.pow(2, semi / 12);
      var o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      o.type = "triangle"; o.frequency.value = f;
      lp.type = "lowpass"; lp.frequency.value = 2400;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(m.vel, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0006, t + 2.8);
      o.connect(lp); lp.connect(g); g.connect(dry); g.connect(rev);
      o.start(t); o.stop(t + 3.0);
    }

    function bass(t, m){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = m.root / 4;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.075, t + 1.2);
      g.gain.exponentialRampToValueAtTime(0.0006, t + 6.5);
      o.connect(g); g.connect(dry); g.connect(rev);
      o.start(t); o.stop(t + 6.8);
    }

    /* 鲸歌本体的一个长句：起音低、往上滑一个五度、再落回来，带慢颤音 */
    function call(t, m){
      var o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      var f0 = m.root * 2;
      o.type = "sine";
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f0 * 1.5, t + 1.5);
      o.frequency.exponentialRampToValueAtTime(f0 * 1.12, t + 3.4);
      var lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 5.2; lg.gain.value = 3.0;
      lfo.connect(lg); lg.connect(o.frequency);
      lfo.start(t); lfo.stop(t + 4.2);
      lp.type = "lowpass"; lp.frequency.value = 1500;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.10, t + 0.9);
      g.gain.linearRampToValueAtTime(0.055, t + 2.4);
      g.gain.linearRampToValueAtTime(0.0001, t + 4.0);
      o.connect(lp); lp.connect(g); g.connect(dry); g.connect(rev);
      o.start(t); o.stop(t + 4.2);
    }

    /* 她停下那一拍：整套声音先掐掉，一秒半后房间音慢慢回来 */
    function hushCut(){
      var now = ctx.currentTime;
      hushing = true;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(Math.max(master.gain.value, 0.0001), now);
      master.gain.exponentialRampToValueAtTime(0.0005, now + 0.18);
      setTimeout(function(){
        if (!ready || !ctx) return;
        var t = ctx.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(0.0005, t);
        master.gain.linearRampToValueAtTime(muted ? 0.0005 : 0.38, t + 2.4);
        hushing = false;
      }, 1500);
    }

    function tick(){
      if (!ready || !ctx || ctx.state !== "running") return;
      var m = M[cur], stepDur = 60 / m.bpm / 2;
      while (next < ctx.currentTime + 0.9) {
        var i = step % 16, d = m.pat[i];
        if (d !== null && d !== undefined) bell(d, next, m);
        if (m.call && i % 8 === 0) call(next, m);
        if (i === 0) bass(next, m);
        step++; next += stepDur;
      }
    }

    function setMood(name){
      want = M[name] ? name : "room";
      if (!ready) { cur = want; return; }
      cur = want;
      var m = M[cur], now = ctx.currentTime;
      var rel = m.fade || 2.2;
      pads.forEach(function(p){
        p.g.gain.cancelScheduledValues(now);
        p.g.gain.setValueAtTime(Math.max(p.g.gain.value, 0.0001), now);
        p.g.gain.exponentialRampToValueAtTime(0.0001, now + rel);
        try { p.o.stop(now + rel + 0.4); } catch (e) {}
      });
      pads = [];
      buildPad(m);
      whaleGain.gain.setTargetAtTime(m.whale ? 0.055 : 0, now, rel / 2);
      if (cur === "hush") hushCut();
    }

    function toggle(){
      if (!ready) init();
      if (!ready) return;
      muted = !muted;
      master.gain.setTargetAtTime(muted ? 0 : 0.38, ctx.currentTime, 0.25);
      try { localStorage.setItem("jingluo_mute", muted ? "1" : "0"); } catch (e) {}
      updateBtn();
      return muted;
    }

    function updateBtn(){
      var b = document.getElementById("btnMute");
      if (b) { b.textContent = muted ? "静音" : "音乐"; b.className = muted ? "" : "act"; }
    }

    function ensure(){
      init();
      if (ctx && ctx.state === "suspended") { try { ctx.resume(); } catch (e) {} }
    }

    document.addEventListener("visibilitychange", function(){
      if (!ready) return;
      if (document.hidden) { try { ctx.suspend(); } catch (e) {} }
      else { try { ctx.resume(); } catch (e) {} }
    });

    /* 人声进来时把配乐压下去，别抢 */
    function duck(on){
      if (!ready || hushing) return;
      var t = ctx.currentTime;
      master.gain.setTargetAtTime(muted ? 0 : (on ? 0.16 : 0.38), t, 0.12);
    }

    return { ensure: ensure, setMood: setMood, toggle: toggle, duck: duck, isMuted: function(){ return muted; },
             debug: function(){ return { ready: ready, state: ctx && ctx.state, mood: cur, stepped: step, pads: pads.length, gain: master && +master.gain.value.toFixed(4) }; } };
  })();
  AUDIO && document.getElementById("btnMute") && (function(){
    var b = document.getElementById("btnMute");
    b.textContent = AUDIO.isMuted() ? "静音" : "音乐";
    b.className = AUDIO.isMuted() ? "" : "act";
  })();

  var MOOD_BY_BG = { B1:"shore", B2:"room", B3:"room", B4:"shore", B5:"tide", B6:"deep", B7:"ending", B8:"empty" };

  var STORY = JSON.parse(document.getElementById("story").textContent);
  var N = STORY.nodes;

  /* ============ 人声：按台词编号挂文件，缺文件就安静跳过 ============
     约定：assets/voice/01.wav … 54.wav，编号 = 涟的第几句台词（按剧本顺序） */
  var VOICE = (function(){
    var el = new Audio();
    var on = (function(){ try { return localStorage.getItem("jingluo_voice") !== "0"; } catch (e) { return true; } })();
    var missing = {}, cur = null, played = 0;
    var order = {}, n = 0;
    Object.keys(N).forEach(function(id){
      (N[id].lines || []).forEach(function(l, i){
        if (l[0] === "涟") { n++; order[id + ":" + i] = n; }
      });
    });
    el.addEventListener("ended", function(){ AUDIO.duck(false); });
    el.addEventListener("error", function(){ if (cur) missing[cur] = 1; AUDIO.duck(false); });

    function pad(k){ return (k < 10 ? "0" : "") + k; }
    function play(nodeId, li){
      if (!on) return;
      var k = order[nodeId + ":" + li];
      if (!k) return;
      var name = pad(k);
      if (missing[name]) return;
      try { el.pause(); el.currentTime = 0; } catch (e) {}
      cur = name;
      el.src = "assets/voice/" + name + ".wav";
      var p = el.play();
      if (p && p.catch) p.catch(function(){});
      AUDIO.duck(true);
      played++;
    }
    function stop(){
      try { el.pause(); el.currentTime = 0; } catch (e) {}
      AUDIO.duck(false);
    }
    function toggle(){
      on = !on;
      if (!on) stop();
      try { localStorage.setItem("jingluo_voice", on ? "1" : "0"); } catch (e) {}
      var b = document.getElementById("btnVoice");
      if (b) { b.textContent = on ? "语音" : "静读"; b.className = on ? "act" : ""; }
      return on;
    }
    return { play: play, stop: stop, toggle: toggle, isOn: function(){ return on; },
             debug: function(){ return { on: on, src: (el.currentSrc || "").split("/").pop(), t: +el.currentTime.toFixed(2),
                                         muted: el.muted, err: el.error && el.error.code, played: played, n: n }; } };
  })();
  (function(){
    var b = document.getElementById("btnVoice");
    if (b) { b.textContent = VOICE.isOn() ? "语音" : "静读"; b.className = VOICE.isOn() ? "act" : ""; }
  })();

  var S = { node:null, li:0, flags:{}, typing:false, auto:false, timer:null, started:false };
  var SAVE_KEY = "jingluo_save_v1", END_KEY = "jingluo_ends_v1";

  var $ = function(id){ return document.getElementById(id); };
  var bgEls = [$("bg0"), $("bg1")], spEls = [$("sp0"), $("sp1")];
  var bgi = 0, spi = 0, curBg = null, curSp = null;

  /* ---------- 占位美术（无外链、无 404，真图一换就消失） ---------- */
  function ph(id){
    var isBg = id.charAt(0) === "B";
    var w = isBg ? 1600 : 900, h = isBg ? 900 : 1200;
    var dark = ["B1","B2","B4","B5","B6","B8"].indexOf(id) >= 0;
    var c1 = dark ? "#16305a" : "#e2eaf3";
    var c2 = dark ? "#050c17" : "#b9cbe0";
    var ink = dark ? "#7ea3d2" : "#4a6488";
    var svg;
    if (isBg) {
      svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">'
        + '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'
        + '<stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/>'
        + '</linearGradient></defs>'
        + '<rect width="' + w + '" height="' + h + '" fill="url(#g)"/>'
        + '<path d="M0 620 Q 200 596 400 620 T 800 620 T 1200 620 T 1600 620" fill="none" stroke="' + ink + '" stroke-width="1.4" opacity=".35"/>'
        + '<path d="M0 664 Q 200 640 400 664 T 800 664 T 1200 664 T 1600 664" fill="none" stroke="' + ink + '" stroke-width="1" opacity=".22"/>'
        + '<rect x="40" y="40" width="' + (w-80) + '" height="' + (h-80) + '" fill="none" stroke="' + ink + '" stroke-width="1" stroke-dasharray="6 10" opacity=".28"/>'
        + '<text x="' + (w/2) + '" y="' + (h/2) + '" fill="' + ink + '" font-family="serif" font-size="46" letter-spacing="10" text-anchor="middle" opacity=".62">' + id + ' · 占位背景</text>'
        + '<text x="' + (w/2) + '" y="' + (h/2 + 58) + '" fill="' + ink + '" font-family="sans-serif" font-size="20" letter-spacing="6" text-anchor="middle" opacity=".38">REPLACE WITH ' + id + '.webp</text>'
        + '</svg>';
    } else {
      svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">'
        + '<g opacity=".30" fill="#7096D1">'
        + '<ellipse cx="450" cy="300" rx="132" ry="152"/>'
        + '<path d="M450 430 C 322 470 292 720 300 1080 L 600 1080 C 608 720 578 470 450 430 Z"/>'
        + '<path d="M120 1090 C 300 1060 600 1060 780 1090 C 700 1130 200 1130 120 1090 Z"/>'
        + '</g>'
        + '<rect x="20" y="20" width="' + (w-40) + '" height="' + (h-40) + '" fill="none" stroke="#7096D1" stroke-width="1.2" stroke-dasharray="8 12" opacity=".35"/>'
        + '<text x="' + (w/2) + '" y="1160" fill="#5a7ba6" font-family="sans-serif" font-size="26" letter-spacing="8" text-anchor="middle" opacity=".8">' + id + '</text>'
        + '</svg>';
    }
    return 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")';
  }
  function art(id){ return ASSETS[id] ? 'url("' + ASSETS[id] + '")' : ph(id); }

  /* 素材缺失时自动退回占位图，不至于开天窗 */
  function validateAssets(){
    Object.keys(ASSETS).forEach(function(id){
      var url = ASSETS[id];
      if (!url) return;
      var probe = new Image();
      probe.onerror = function(){
        ASSETS[id] = null;
        if (curBg === id) { curBg = null; setBg(id); }
        if (curSp === id) { curSp = null; setSp(id); }
        showToast("素材缺失：" + id + "，已回退占位图");
      };
      probe.src = url;
    });
  }

  /* ---------- 画面层 ---------- */
  function setBg(id){
    if (!id || id === curBg) return;
    curBg = id;
    AUDIO.setMood(MOOD_BY_BG[id] || "room");
    var next = bgEls[bgi], prev = bgEls[1 - bgi];
    next.style.backgroundImage = art(id);
    next.style.opacity = "1";
    prev.style.opacity = "0";
    bgi = 1 - bgi;
  }
  function setSp(id){
    if (id === curSp) return;
    curSp = id;
    var next = spEls[spi], prev = spEls[1 - spi];
    if (!id) { next.style.opacity = "0"; prev.style.opacity = "0"; spi = 1 - spi; return; }
    next.style.backgroundImage = art(id);
    next.style.opacity = "1";
    prev.style.opacity = "0";
    spi = 1 - spi;
  }

  /* ---------- 打字机 ---------- */
  function type(text, cls){
    var tx = $("tx");
    tx.className = cls || "";
    tx.textContent = "";
    $("hint").className = "";
    S.typing = true;
    var i = 0;
    clearInterval(S.timer);
    S.timer = setInterval(function(){
      i += 1;
      tx.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(S.timer);
        S.typing = false;
        $("hint").className = "on";
      }
    }, 22);
  }
  function finishTyping(text, cls){
    clearInterval(S.timer);
    $("tx").textContent = text;
    $("tx").className = cls || "";
    S.typing = false;
    $("hint").className = "on";
  }

  /* ---------- 节点推进 ---------- */
  function applySet(obj){
    if (!obj) return;
    for (var k in obj) if (Object.prototype.hasOwnProperty.call(obj, k)) S.flags[k] = obj[k];
  }
  function pass(req){
    if (!req) return true;
    for (var k in req) if (S.flags[k] !== req[k]) return false;
    return true;
  }
  function go(id){
    var node = N[id];
    if (!node) { showToast("缺失节点 " + id); return; }
    S.node = id; S.li = 0;
    $("box").className = "on";
    $("chs").className = "";
    applySet(node.set);
    if (node.bg) setBg(node.bg);
    if (node.mood) AUDIO.setMood(node.mood);
    if (Object.prototype.hasOwnProperty.call(node, "sp")) setSp(node.sp);
    if (!node.lines || node.lines.length === 0) {
      /* 选项节点不擦掉上一句，玩家要能看见自己正在回应什么 */
      if (!$("tx").textContent) $("box").className = "";
      if (node.choices) return showChoices(node);
      if (node.end) return showEnd(node.end);
      return;
    }
    renderLine();
  }
  function renderLine(){
    var node = N[S.node], ln = node.lines[S.li];
    var who = ln[0], text = ln[1];
    if (who) { $("nm").className = ""; $("nm").textContent = who; }
    else { $("nm").className = "hide"; $("nm").textContent = ""; }
    type(text, who ? "" : "nar");
    if (who === "涟") VOICE.play(S.node, S.li); else VOICE.stop();
  }
  function advance(){
    if (!S.started || $("title").className.indexOf("hide") < 0) return;
    if ($("chs").className === "on") return;
    if ($("end").className === "on") return;
    if (S.typing) {
      var node = N[S.node], ln = node.lines[S.li];
      finishTyping(ln[1], ln[0] ? "" : "nar");
      return;
    }
    var cur = N[S.node];
    S.li += 1;
    if (S.li < cur.lines.length) return renderLine();
    if (cur.choices) return showChoices(cur);
    if (cur.end) return showEnd(cur.end);
    if (cur.next) return go(cur.next);
  }
  function showChoices(node){
    var box = $("chs");
    box.innerHTML = "";
    node.choices.forEach(function(c, idx){
      var b = document.createElement("button");
      var key = c.k || ("0" + (idx + 1));
      b.innerHTML = '<span>' + key + '</span>' + c.t;
      b.onclick = function(ev){
        ev.stopPropagation();
        var to = pass(c.req) ? c.to : c.fail;
        box.className = "";
        applySet(c.set);
        go(to);
      };
      box.appendChild(b);
    });
    box.className = "on";
    $("hint").className = "";
  }
  function showEnd(e){
    $("box").className = "";
    $("endTag").textContent = e.tag;
    $("endTitle").textContent = e.title;
    $("endBody").innerText = e.body;
    $("end").className = "on";
    hud(false);
    VOICE.stop();
    AUDIO.setMood("ending");
    var got = loadEnds();
    if (got.indexOf(e.tag) < 0) { got.push(e.tag); saveEnds(got); }
    $("unlock").textContent = "结局收集 " + got.length + " / 4";
    try { localStorage.removeItem(SAVE_KEY); } catch(err){}
    $("btnCont").disabled = true;
  }

  /* ---------- 存档 ---------- */
  function save(){
    if (!S.started || !S.node) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ node:S.node, li:S.li, flags:S.flags }));
      showToast("已存档");
    } catch(err){ showToast("存档失败：浏览器拒绝了本地存储"); }
  }
  function load(){
    var raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch(err){}
    if (!raw) { showToast("没有存档"); return; }
    var d;
    try { d = JSON.parse(raw); } catch(err){ showToast("存档损坏"); return; }
    hideTitle();
    S.flags = d.flags || {};
    S.node = d.node; S.li = Math.max(0, d.li || 0);
    var node = N[S.node];
    $("end").className = "";
    $("chs").className = "";
    $("box").className = "on";
    applySet(node.set);
    if (node.bg) setBg(node.bg);
    if (node.mood) AUDIO.setMood(node.mood);
    if (Object.prototype.hasOwnProperty.call(node, "sp")) setSp(node.sp);
    if (!node.lines || !node.lines[S.li]) S.li = 0;
    renderLine();
    showToast("已读档");
  }
  function hasSave(){
    try { return !!localStorage.getItem(SAVE_KEY); } catch(err){ return false; }
  }
  function loadEnds(){
    try { var a = JSON.parse(localStorage.getItem(END_KEY) || "[]"); return Array.isArray(a) ? a : []; }
    catch(err){ return []; }
  }
  function saveEnds(a){ try { localStorage.setItem(END_KEY, JSON.stringify(a)); } catch(err){} }

  /* ---------- 杂项 ---------- */
  var toastTimer;
  function showToast(msg){
    var t = $("toast");
    t.textContent = msg; t.className = "on";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = ""; }, 1400);
  }
  function hud(v){
    var h = $("hud");
    h.style.opacity = v ? "1" : "0";
    h.style.pointerEvents = v ? "auto" : "none";
  }
  function hideTitle(){
    $("title").className = "hide";
    S.started = true;
    $("box").className = "on";
  }
  function startGame(){
    hideTitle();
    hud(true);
    AUDIO.ensure();
    S.flags = {}; curBg = null; curSp = null;
    $("end").className = "";
    go(STORY.start);
  }
  function toTitle(){
    S.started = false;
    hud(false);
    VOICE.stop();
    AUDIO.setMood("title");
    $("title").className = "";
    $("box").className = "";
    $("chs").className = "";
    $("end").className = "";
    $("btnCont").disabled = !hasSave();
    var got = loadEnds();
    $("unlock").textContent = "结局收集 " + got.length + " / 4";
  }

  /* ---------- 缩放 ---------- */
  function fit(){
    var s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    $("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);

  /* ---------- 事件 ---------- */
  document.getElementById("stage").addEventListener("click", function(ev){
    AUDIO.ensure();
    if (ev.target.closest("#hud") || ev.target.closest("#title") || ev.target.closest("#end") || ev.target.closest("#chs")) return;
    advance();
  });
  document.addEventListener("keydown", function(ev){
    if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); advance(); }
    if (ev.key === "s" || ev.key === "S") save();
    if (ev.key === "l" || ev.key === "L") load();
    if (/^[1-9]$/.test(ev.key)) {
      var btns = document.querySelectorAll("#chs button");
      var i = parseInt(ev.key, 10) - 1;
      if (btns[i]) btns[i].click();
    }
  });
  document.body.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    AUDIO.ensure();
    if (act === "voice") {
      var von = VOICE.toggle();
      showToast(von ? "人声已开启" : "已切到静读");
      return;
    }
    if (act === "mute") {
      var m = AUDIO.toggle();
      showToast(m ? "已静音" : "音乐已开启");
      return;
    }
    if (act === "start" || act === "restart") { $("end").className = ""; startGame(); }
    if (act === "continue") load();
    if (act === "save") save();
    if (act === "load") load();
    if (act === "title") toTitle();
    if (act === "auto") {
      S.auto = !S.auto;
      $("btnAuto").className = S.auto ? "act" : "";
      if (S.auto) autoLoop();
    }
  });
  function autoLoop(){
    if (!S.auto) return;
    setTimeout(function(){
      if (!S.auto) return;
      var chs = $("chs").className === "on", end = $("end").className === "on";
      if (!chs && !end && S.started) advance();
      autoLoop();
    }, 2100);
  }

  fit();
  validateAssets();
  /* 开发钩子：#play 跳过标题直接开始；#node:s5 直达某节点并预设满条件 */
  if (location.hash) {
    var dbg = document.createElement("style");
    dbg.textContent = "*{transition:none!important;animation:none!important}";
    document.head.appendChild(dbg);
  }
  if (location.hash === "#play") startGame();
  if (location.hash.indexOf("#node:") === 0) {
    hideTitle();
    $("title").style.display = "none";
    S.flags = { trust:1, knows:1 };
    go(location.hash.slice(6));
  }
  $("btnCont").disabled = !hasSave();
  $("unlock").textContent = "结局收集 " + loadEnds().length + " / 4";

  /* 供离线校验用 */
  window.__story = STORY;
  window.__audio = AUDIO.debug;
  window.__voice = VOICE.debug;
})();
</script>
</body>
</html>
